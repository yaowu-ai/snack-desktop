[package]
name = "snack-desktop"
version = "0.1.0"
description = "Snack desktop client"
authors = ["Snack"]
edition = "2021"

[lib]
name = "snack_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Snack"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cpal = "0.15"
crossbeam-channel = "0.5"
fs4 = "1.1"
futures-util = "0.3"
notify-rust = "4.18.0"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream", "json"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sherpa-onnx = "1.13.4"
sha2 = "0.10"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2.5.4"
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = { version = "2.4.3", features = ["deep-link"] }
tauri-plugin-updater = "2.10.1"
tokio = { version = "1", features = ["fs", "io-util", "time", "sync"] }
whisper-rs = { version = "0.14", features = ["metal"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
core-graphics = "0.25"
objc2-app-kit = { version = "0.3.2", features = ["NSPasteboard"] }
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", features = ["NSString"] }
screencapturekit = { version = "=1.5.4", features = ["macos_13_0"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.60", default-features = false, features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_Foundation", "Win32_Security", "Win32_System_Variant"] }
windows-sys = { version = "0.61.2", features = ["Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole"] }
