<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title data-i18n="windowTitle"></title>
<style>
  :root { color-scheme: light; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body {
    padding: 1px; color: #0f172a; user-select: none; -webkit-user-select: none;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  button, input, select { font: inherit; }
  .card {
    position: relative; width: 100%; height: 100%; overflow: hidden;
    border: 1px solid #fee5d0; border-radius: 12px; background: rgba(255, 255, 255, .98);
    background-clip: padding-box;
  }
  .drag-region { position: absolute; z-index: 1; inset: 0 0 auto; height: 16px; cursor: grab; }
  .drag-region:active { cursor: grabbing; }
  .drag-hint {
    position: absolute; left: 50%; top: 2px; transform: translateX(-50%);
    color: #cbd5e1; font-size: 9px; line-height: 12px; pointer-events: none; white-space: nowrap;
  }
  .summary {
    position: relative; display: grid; grid-template-columns: 38px minmax(0, 1fr) 38px;
    align-items: center; gap: 8px; min-height: 106px; padding: 16px 10px 18px;
  }
  .icon-button {
    display: inline-flex; width: 38px; height: 38px; align-items: center; justify-content: center;
    border-radius: 10px; cursor: pointer; transition: background .15s ease, opacity .15s ease;
  }
  .icon-button[hidden] { display: none; }
  .icon-button svg { width: 16px; height: 16px; fill: currentColor; }
  .pause-action { grid-column: 1; grid-row: 1; border: 1px solid #fe720a; background: #fff; color: #fe720a; }
  .pause-action:hover { background: #fff7ed; }
  .stop-action { grid-column: 3; grid-row: 1; border: 1px solid #fe720a; background: #fe720a; color: #fff; }
  .stop-action:hover { background: #e96608; }
  .icon-button:disabled { cursor: default; opacity: .55; }
  .status { grid-column: 2; grid-row: 1; min-width: 0; text-align: center; }
  .title-row { display: flex; align-items: center; justify-content: center; gap: 6px; }
  .status-dot {
    width: 8px; height: 8px; flex: 0 0 auto; border-radius: 50%; background: #fe720a;
    animation: pulse 1.2s infinite;
  }
  body[data-paused="true"] .status-dot { animation: none; opacity: .45; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
  .title { overflow: hidden; font-size: 12px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
  .metric { margin-top: 3px; font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .waveform { display: flex; align-items: center; justify-content: space-between; width: 94px; height: 20px; margin: 2px auto 0; pointer-events: none; }
  .waveform span { width: 2px; height: 2px; border-radius: 1px; background: #cbd5e1; }
  .expand-action {
    position: absolute; bottom: 1px; left: 50%; display: inline-flex; width: 28px; height: 20px;
    transform: translateX(-50%); align-items: center;
    justify-content: center; border: 0; background: transparent; color: #94a3b8; cursor: pointer;
  }
  .expand-action svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; }
  .error {
    position: absolute; right: 56px; bottom: 7px; left: 56px; overflow: hidden;
    color: #dc2626; font-size: 9px; text-align: center; text-overflow: ellipsis; white-space: nowrap;
  }
  .settings { display: none; border-top: 1px solid #f1f5f9; padding: 8px 12px 12px; }
  body[data-expanded="true"] .settings { display: block; }
  .setting-row {
    display: flex; min-height: 48px; align-items: center; justify-content: space-between;
    gap: 8px; border-bottom: 1px solid #f8fafc;
  }
  .setting-row:last-child { border-bottom: 0; }
  .setting-label { flex: 1 1 45%; min-width: 0; color: #475569; font-size: 12px; font-weight: 600; }
  .filename-input {
    max-width: 50%;
    width: auto; min-width: 0; flex: 1; border: 1px solid transparent; border-radius: 7px;
    background: transparent; color: #0f172a; font-size: 12px; text-align: right;
    text-overflow: ellipsis; outline: none; cursor: pointer; user-select: text; -webkit-user-select: text;
  }
  .filename-input:not([readonly]) { border-color: #fdba74; padding: 5px 7px; background: #fff; cursor: text; }
  .project-select {
    width: 110px; max-width: 50%; min-width: 0; border: 0; background: transparent; color: #0f172a;
    font-size: 12px; text-align: right; text-align-last: right; text-overflow: ellipsis;
    outline: none; cursor: pointer;
  }
  .switch {
    position: relative; width: 34px; height: 20px; border: 0; border-radius: 999px;
    background: #cbd5e1; cursor: pointer; transition: background .15s ease;
  }
  .switch::after {
    content: ""; position: absolute; width: 16px; height: 16px; left: 2px; top: 2px;
    border-radius: 50%; background: #fff; transition: transform .15s ease;
  }
  .switch[aria-checked="true"] { background: #fe720a; }
  .switch[aria-checked="true"]::after { transform: translateX(14px); }
</style>
</head>
<body data-paused="false" data-expanded="false">
  <div class="card">
    <div class="drag-region" data-tauri-drag-region><div class="drag-hint" data-i18n="drag"></div></div>
    <div class="summary">
      <button class="icon-button pause-action" id="pause-action" type="button" data-i18n-label="pause">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z" /></svg>
      </button>
      <button class="icon-button pause-action" id="resume-action" type="button" data-i18n-label="resume" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16l13-8z" /></svg>
      </button>
      <div class="status">
        <div class="title-row"><span class="status-dot"></span><span class="title" id="title" data-i18n="recording"></span></div>
        <div class="metric" id="metric">00:00</div>
        <div class="waveform" id="waveform" aria-hidden="true"></div>
      </div>
      <button class="icon-button stop-action" id="stop-action" type="button" data-i18n-label="stop">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h12v12H6z" /></svg>
      </button>
      <button class="expand-action" id="expand-action" type="button" data-i18n-label="expand">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path id="chevron" d="m6 9 6 6 6-6" /></svg>
      </button>
      <div class="error" id="error" hidden></div>
    </div>
    <div class="settings">
      <label class="setting-row">
        <span class="setting-label" data-i18n="fileTitle"></span>
        <input class="filename-input" id="filename-input" type="text" readonly data-i18n-label="fileTitle" />
      </label>
      <div class="setting-row">
        <span class="setting-label" data-i18n="autoNotes"></span>
        <button class="switch" id="auto-notes" type="button" role="switch" aria-checked="false" data-i18n-label="autoNotesLabel"></button>
      </div>
      <label class="setting-row">
        <span class="setting-label" data-i18n="project"></span>
        <select class="project-select" id="project-select" data-i18n-label="project"></select>
      </label>
    </div>
  </div>
  <!--SNACK_LOCALE-->
  <script>
    (function () {
      var t = window.snackText;
      var current = { elapsedMs: 0, recordingId: '', paused: false, displayName: '', autoGenerateNotesEnabled: false, transcriptProjectId: '', transcriptProjectName: '', projects: [] };
      var expanded = false;
      var pending = false;
      var errorMessage = '';
      var projectSignature = '';
      var titleEl = document.getElementById('title');
      var metricEl = document.getElementById('metric');
      var errorEl = document.getElementById('error');
      var pauseAction = document.getElementById('pause-action');
      var resumeAction = document.getElementById('resume-action');
      var stopAction = document.getElementById('stop-action');
      var expandAction = document.getElementById('expand-action');
      var chevron = document.getElementById('chevron');
      var filenameInput = document.getElementById('filename-input');
      var autoNotes = document.getElementById('auto-notes');
      var projectSelect = document.getElementById('project-select');
      var waveform = document.getElementById('waveform');
      var levels = Array(20).fill(0);
      var meterExpiry;
      var meterBars = levels.map(function () {
        var bar = document.createElement('span');
        waveform.appendChild(bar);
        return bar;
      });

      function renderMeter() {
        meterBars.forEach(function (bar, index) {
          bar.style.height = (2 + levels[index] * 14) + 'px';
          bar.style.backgroundColor = levels[index] > 0 ? '#fe720a' : '#cbd5e1';
        });
      }
      function updateMeter(reset) {
        clearTimeout(meterExpiry);
        var value = current.audioLevelDb;
        var available = !reset && !current.paused && typeof value === 'number' && Number.isFinite(value);
        levels = available ? levels.slice(1).concat(Math.max(0, Math.min(1, (value + 60) / 60))) : Array(20).fill(0);
        renderMeter();
        meterExpiry = setTimeout(function () { levels = Array(20).fill(0); renderMeter(); }, 750);
      }

      function invoke(command, args) {
        if (window.__TAURI__ && window.__TAURI__.core) return window.__TAURI__.core.invoke(command, args || {});
        if (window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke) return window.__TAURI_INTERNALS__.invoke(command, args || {});
        return Promise.reject(new Error(t('bridgeUnavailable')));
      }
      function withTimeout(promise, timeoutMs) {
        return Promise.race([promise, new Promise(function (_, reject) {
          setTimeout(function () { reject(new Error(t('timeout'))); }, timeoutMs);
        })]);
      }
      function formatDuration(ms) {
        var total = Math.floor(ms / 1000);
        return String(Math.floor(total / 60)).padStart(2, '0') + ':' + String(total % 60).padStart(2, '0');
      }
      function showError(error, fallback) {
        pending = false;
        errorMessage = fallback;
        console.error('[meeting-overlay]', error);
        render();
      }
      function renderProjectOptions() {
        var projects = current.projects || [];
        var selectedId = current.transcriptProjectId || '';
        var signature = selectedId + '|' + projects.map(function (item) { return item.projectId + ':' + item.projectName; }).join('|');
        if (signature === projectSignature) return;
        projectSignature = signature;
        projectSelect.replaceChildren();
        projectSelect.add(new Option(t('unsaved'), ''));
        projects.forEach(function (project) { projectSelect.add(new Option(project.projectName, project.projectId)); });
        if (selectedId && !projects.some(function (project) { return project.projectId === selectedId; })) {
          projectSelect.add(new Option(current.transcriptProjectName || t('selectedProject'), selectedId));
        }
        projectSelect.value = selectedId;
        projectSelect.title = selectedId ? (current.transcriptProjectName || t('selectedProject')) : t('unsaved');
      }
      function render() {
        document.body.dataset.paused = String(Boolean(current.paused));
        document.body.dataset.expanded = String(expanded);
        titleEl.textContent = t(['recording', 'paused'][Number(Boolean(current.paused))]);
        metricEl.textContent = formatDuration(current.elapsedMs || 0);
        pauseAction.hidden = Boolean(current.paused);
        resumeAction.hidden = !current.paused;
        pauseAction.disabled = pending;
        resumeAction.disabled = pending;
        stopAction.disabled = pending;
        chevron.setAttribute('d', expanded ? 'm6 15 6-6 6 6' : 'm6 9 6 6 6-6');
        expandAction.title = expandAction.ariaLabel = t(['expand', 'collapse'][Number(expanded)]);
        if (document.activeElement !== filenameInput) filenameInput.value = current.displayName || '';
        autoNotes.setAttribute('aria-checked', String(Boolean(current.autoGenerateNotesEnabled)));
        renderProjectOptions();
        errorEl.hidden = !errorMessage;
        errorEl.textContent = errorMessage && t(errorMessage);
      }
      function apply(next) {
        if (!next) return;
        var changed = next.recordingId && next.recordingId !== current.recordingId;
        current = Object.assign({}, current, next);
        if (changed) { pending = false; errorMessage = ''; expanded = false; }
        updateMeter(changed);
        render();
      }
      function togglePause() {
        if (pending) return;
        pending = true; errorMessage = ''; render();
        invoke('meeting_set_recording_paused', { paused: !current.paused })
          .then(function () { pending = false; })
          .catch(function (error) { showError(error, 'pauseFailed'); });
      }
      function stopViaProtocol() {
        return withTimeout(fetch('/stop', { method: 'POST', cache: 'no-store' }), 4000).then(function (response) {
          if (response.ok) return;
          return response.text().then(function (message) { throw new Error(message || t('stopFailed')); });
        });
      }
      function stopRecording() {
        if (pending) return;
        pending = true; errorMessage = ''; render();
        withTimeout(invoke('meeting_stop_recording', {}), 4000)
          .catch(function () { return stopViaProtocol(); })
          .catch(function (error) { showError(error, 'stopFailed'); });
      }
      function toggleExpanded() {
        var next = !expanded;
        invoke('set_overlay_expanded', { expanded: next }).then(function () {
          expanded = next; render();
        }).catch(function (error) { showError(error, 'expandFailed'); });
      }
      function beginRename() {
        filenameInput.readOnly = false;
        filenameInput.value = '';
        filenameInput.focus();
      }
      function saveRename() {
        if (filenameInput.readOnly) return;
        filenameInput.readOnly = true;
        invoke('meeting_set_transcript_file_title', { displayName: filenameInput.value })
          .catch(function (error) { showError(error, 'renameFailed'); });
      }
      function toggleAutoNotes() {
        var enabled = !current.autoGenerateNotesEnabled;
        invoke('meeting_set_recording_auto_notes', { enabled: enabled })
          .catch(function (error) { showError(error, 'autoNotesFailed'); });
      }
      function selectTranscriptProject() {
        var projectId = projectSelect.value || null;
        var project = (current.projects || []).find(function (item) { return item.projectId === projectId; });
        errorMessage = '';
        render();
        invoke('meeting_set_transcript_project', {
          recordingId: current.recordingId,
          projectId: projectId,
          projectName: project ? project.projectName : null
        }).catch(function (error) {
          projectSignature = '';
          showError(error, 'projectFailed');
        });
      }

      pauseAction.addEventListener('click', function (event) { event.stopPropagation(); togglePause(); });
      resumeAction.addEventListener('click', function (event) { event.stopPropagation(); togglePause(); });
      stopAction.addEventListener('click', function (event) { event.stopPropagation(); stopRecording(); });
      expandAction.addEventListener('click', function (event) { event.stopPropagation(); toggleExpanded(); });
      filenameInput.addEventListener('click', function (event) { event.stopPropagation(); if (filenameInput.readOnly) beginRename(); });
      filenameInput.addEventListener('blur', saveRename);
      filenameInput.addEventListener('keydown', function (event) {
        if (event.key === 'Enter') filenameInput.blur();
        if (event.key === 'Escape') { filenameInput.readOnly = true; filenameInput.value = current.displayName || ''; filenameInput.blur(); }
      });
      autoNotes.addEventListener('click', function (event) { event.stopPropagation(); toggleAutoNotes(); });
      projectSelect.addEventListener('click', function (event) { event.stopPropagation(); });
      projectSelect.addEventListener('change', function (event) { event.stopPropagation(); selectTranscriptProject(); });
      window.renderSnackLocale = function () { projectSignature = ''; render(); };
      render();
      try {
        var eventApi = window.__TAURI__ && window.__TAURI__.event;
        if (eventApi) eventApi.listen('meeting-overlay-state', function (event) { apply(event.payload); });
        invoke('meeting_get_recording_overlay_state', {}).then(apply).catch(function () {});
      } catch (error) {}
    })();
  </script>
</body>
</html>
