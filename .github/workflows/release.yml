name: Release

on:
  push:
    tags: ["v*", "*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  build-macos:
    name: macOS (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            runner: macos-latest
            target: aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
            dmg_arch_suffix: apple-silicon
            release_arch_suffix: arm64
            artifact_label: apple-silicon
          - name: Intel
            runner: macos-26-intel
            target: x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
            dmg_arch_suffix: intel
            release_arch_suffix: x64
            artifact_label: intel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust target
        run: rustup target add ${{ matrix.rust_target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare release context
        id: version
        uses: ./.github/actions/prepare-release-context
        with:
          prod_host: ${{ vars.SNACK_HOST }}
          qa_host: ${{ vars.SNACK_QA_HOST }}

      - name: Validate required secrets
        shell: bash
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in \
            TAURI_UPDATER_PUBKEY \
            TAURI_SIGNING_PRIVATE_KEY \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_ID \
            APPLE_PASSWORD \
            APPLE_TEAM_ID
          do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required GitHub secret: ${name}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Validate updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          printf 'snack updater signing check' > "$RUNNER_TEMP/updater-signing-check.txt"
          npx tauri signer sign \
            -k "$TAURI_SIGNING_PRIVATE_KEY" \
            ${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:+-p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"} \
            "$RUNNER_TEMP/updater-signing-check.txt" >/dev/null

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign

          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Package signed macOS app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SNACK_PROD_UPDATER_ENDPOINT: ${{ secrets.SNACK_PROD_UPDATER_ENDPOINT }}
          SNACK_QA_UPDATER_ENDPOINT: ${{ secrets.SNACK_QA_UPDATER_ENDPOINT }}
          SNACK_DESKTOP_BASE_UA: ${{ secrets.SNACK_DESKTOP_BASE_UA }}
          TARGET_TRIPLE: ${{ matrix.target }}
          APP_VERSION: ${{ steps.version.outputs.artifact_version }}
          DMG_ARCH_SUFFIX: ${{ matrix.dmg_arch_suffix }}
        run: bash scripts/package-macos-release.sh

      - name: Upload macOS bundle to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/Snack_${{ steps.version.outputs.artifact_version }}_macos_${{ matrix.release_arch_suffix }}.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/Snack_${{ steps.version.outputs.artifact_version }}_macos_${{ matrix.release_arch_suffix }}.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/Snack_${{ steps.version.outputs.artifact_version }}_macos_${{ matrix.release_arch_suffix }}.app.tar.gz.sig
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: ${{ steps.version.outputs.release_prerelease }}
          make_latest: ${{ steps.version.outputs.release_make_latest }}
          fail_on_unmatched_files: true

  build-windows-x64:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare release context
        id: version
        uses: ./.github/actions/prepare-release-context
        with:
          prod_host: ${{ vars.SNACK_HOST }}
          qa_host: ${{ vars.SNACK_QA_HOST }}

      - name: Validate required secrets
        shell: bash
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          missing=0
          for name in TAURI_UPDATER_PUBKEY TAURI_SIGNING_PRIVATE_KEY
          do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required GitHub secret: ${name}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Validate updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          printf 'snack updater signing check' > "$RUNNER_TEMP/updater-signing-check.txt"
          npx tauri signer sign \
            -k "$TAURI_SIGNING_PRIVATE_KEY" \
            ${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:+-p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"} \
            "$RUNNER_TEMP/updater-signing-check.txt" >/dev/null

      - name: Build Tauri app
        run: npm run build -- --bundles nsis
        env:
          CI: true
          # sherpa-onnx's Windows static archive uses the /MT runtime.
          CMAKE_POLICY_DEFAULT_CMP0091: NEW
          CMAKE_MSVC_RUNTIME_LIBRARY: MultiThreaded
          SNACK_CREATE_UPDATER_ARTIFACTS: false
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SNACK_PROD_UPDATER_ENDPOINT: ${{ secrets.SNACK_PROD_UPDATER_ENDPOINT }}
          SNACK_QA_UPDATER_ENDPOINT: ${{ secrets.SNACK_QA_UPDATER_ENDPOINT }}
          SNACK_DESKTOP_BASE_UA: ${{ secrets.SNACK_DESKTOP_BASE_UA }}

      - name: Stage Windows bundle artifacts
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          SRC_DIR="src-tauri/target/release/bundle/nsis"
          DST_DIR="artifacts/Snack-${{ steps.version.outputs.artifact_version }}-windows-x64"
          mkdir -p "$DST_DIR"

          find "$SRC_DIR" -type f -name '*.exe' -print0 | while IFS= read -r -d '' src; do
            filename="Snack_${{ steps.version.outputs.artifact_version }}_windows_x64.exe"
            cp "$src" "$DST_DIR/$filename"
          done

          EXE_PATH="$DST_DIR/Snack_${{ steps.version.outputs.artifact_version }}_windows_x64.exe"
          if [[ ! -s "$EXE_PATH" ]]; then
            echo "Expected Windows installer not found: $EXE_PATH" >&2
            exit 1
          fi

          SIGNATURE_PATH="${EXE_PATH}.sig"
          rm -f "$SIGNATURE_PATH"
          SIGN_OUTPUT="$(npx tauri signer sign \
            -k "$TAURI_SIGNING_PRIVATE_KEY" \
            ${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:+-p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"} \
            "$EXE_PATH")"
          if [[ ! -s "$SIGNATURE_PATH" ]]; then
            printf '%s\n' "$SIGN_OUTPUT" | awk '/^Public signature:/{getline; print; exit}' > "$SIGNATURE_PATH"
            if [[ ! -s "$SIGNATURE_PATH" ]]; then
              echo "Failed to extract Windows updater signature." >&2
              printf '%s\n' "$SIGN_OUTPUT" >&2
              exit 1
            fi
          fi

          find "$DST_DIR" -maxdepth 1 -type f -print

      - name: Upload Windows bundle to Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/Snack-${{ steps.version.outputs.artifact_version }}-windows-x64/*
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: ${{ steps.version.outputs.release_prerelease }}
          make_latest: ${{ steps.version.outputs.release_make_latest }}
          fail_on_unmatched_files: true

  notify-wecom:
    name: Notify WeCom
    needs:
      - build-macos
      - build-windows-x64
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    env:
      MACOS_RESULT: ${{ needs.build-macos.result }}
      WINDOWS_RESULT: ${{ needs.build-windows-x64.result }}
      NOTICE_RELEASE_URL: ${{ secrets.NOTICE_RELEASE_URL }}
      NOTICE_WECOM: ${{ secrets.NOTICE_WECOM }}
    steps:
      - name: Send packaging result
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$NOTICE_WECOM" ]]; then
            echo "::error::Missing required GitHub Actions Secret: NOTICE_WECOM"
            exit 1
          fi

          VERSION="${GITHUB_REF_NAME#v}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          if [[ "$MACOS_RESULT" == "success" && "$WINDOWS_RESULT" == "success" ]]; then
            if [[ -z "$NOTICE_RELEASE_URL" ]]; then
              echo "::error::Missing required GitHub Actions Secret: NOTICE_RELEASE_URL"
              exit 1
            fi
            CONTENT="Snack桌面端${VERSION}已经打包成功,请去 ${NOTICE_RELEASE_URL} 进行发布."
          else
            FAILED_PLATFORMS=()
            [[ "$MACOS_RESULT" == "success" ]] || FAILED_PLATFORMS+=("macOS")
            [[ "$WINDOWS_RESULT" == "success" ]] || FAILED_PLATFORMS+=("Windows")
            FAILED_PLATFORM_TEXT="$(IFS='、'; echo "${FAILED_PLATFORMS[*]}")"
            CONTENT="Snack桌面端${VERSION} ${FAILED_PLATFORM_TEXT}平台打包失败, 请去 ${RUN_URL} 查看日志"
          fi

          PAYLOAD="$(jq -n --arg content "$CONTENT" '{msgtype: "text", text: {content: $content}}')"
          RESPONSE="$(curl --silent --show-error --fail-with-body \
            --retry 3 \
            --retry-all-errors \
            --header 'Content-Type: application/json' \
            --data "$PAYLOAD" \
            "$NOTICE_WECOM")"

          if [[ "$(jq -r '.errcode // empty' <<< "$RESPONSE")" != "0" ]]; then
            echo "::error::WeCom notification failed: $RESPONSE"
            exit 1
          fi
